---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: manager-role
  namespace: kubebuilder-system
rules:
- apiGroups:
  - kubebird.github.io
  resources:
  - instances
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - kubebird.github.io
  resources:
  - instances/finalizers
  verbs:
  - update
- apiGroups:
  - kubebird.github.io
  resources:
  - instances/status
  verbs:
  - get
  - patch
  - update
