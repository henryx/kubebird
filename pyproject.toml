[project]
name = "kubebird"
version = "0.1.0"
description = "Kubebird - A Kubernetes operator for Firebird"
requires-python = ">=3.14"
authors = [
    { name = "Enrico Bianchi", email = "enrico.bianchi@gmail.com" }
]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "kopf>=1.44.6",
    "kubernetes>=36.0.3",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
    "testcontainers>=4.15.0",
    "tox>=4.58.0",
]
