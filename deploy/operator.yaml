# Deploys the Kubebird operator into its own fixed "kubebird-system" namespace (created below),
# rather than inferring one at apply-time. This is what lets the ClusterRoleBinding's
# `subjects[].namespace` below be hardcoded correctly by construction: a ClusterRoleBinding is
# cluster-scoped and has no "current namespace" to infer from, so Kubernetes always requires that
# value spelled out explicitly -- fixing the operator's own namespace means there's exactly one
# correct value, instead of a manual edit you have to remember to keep in sync.
#
# Install with a plain `kubectl apply -f deploy/crd.yaml -f deploy/operator.yaml` (no `-n` needed).
#
# The Role/RoleBinding below scope the operator's own workload (Instances, Secrets, ConfigMaps,
# PVCs, Services, StatefulSets, pod exec) to this same "kubebird-system" namespace -- so Instance
# CRs must be created there too. A thin ClusterRole/ClusterRoleBinding is still required even so:
# kopf's own framework needs read access to two genuinely cluster-scoped resource types
# (CustomResourceDefinitions, Namespaces) that have no namespaced equivalent to grant instead.
# See: https://kopf.dev/en/stable/deployment/ and https://kopf.dev/en/stable/rbac/
apiVersion: v1
kind: Namespace
metadata:
  name: kubebird-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubebird-operator
  namespace: kubebird-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubebird-operator-cluster
rules:
  # Framework: kopf's runtime observation of CRDs & namespaces (both cluster-scoped resource
  # types, so this cannot be expressed as a namespaced Role no matter how narrow the operator's
  # own workload is).
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [list, watch]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubebird-operator-cluster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubebird-operator-cluster
subjects:
  - kind: ServiceAccount
    name: kubebird-operator
    namespace: kubebird-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubebird-operator
  namespace: kubebird-system
rules:
  # Framework: cross-operator awareness (harmless no-op unless a KopfPeering CRD is separately
  # installed and peering is explicitly requested -- kubebird runs a single replica, so peering
  # itself is not required, only tolerated per kopf's own recommended RBAC).
  - apiGroups: [kopf.dev]
    resources: [kopfpeerings]
    verbs: [list, watch, patch, get]
  # Framework: posting events about handler progress/errors.
  - apiGroups: [""]
    resources: [events]
    verbs: [create]

  # Application: the Instance custom resource this operator watches and reconciles.
  - apiGroups: [kubebird.github.io]
    resources: [instances, instances/status]
    verbs: [get, list, watch, patch]
  # Application: the SYSDBA secret (auto-generated, or read+labeled if user-provided via
  # authentication.sysdba.secretRef) -- create.py/k8s.py/update.py get/create/patch it,
  # update.py's sysdba_secret_update_fn additionally lists/watches Secrets cluster-wide-in-namespace
  # to notice rotations.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch, create, patch]
  # Application: the databases.conf ConfigMap (one alias per spec.databases entry, plus the
  # version-specific security.db alias) -- created by create_fn, patched by update_fn whenever
  # spec.databases/spec.version change.
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create, patch]
  # Application: the primary/shadow PersistentVolumeClaims -- created once, never patched/deleted
  # (deletion happens via Kubernetes garbage-collecting kopf.adopt()-ed owner references).
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [create]
  # Application: the Service -- created by create_fn, patched in place by update_fn
  # (spec.service.type/port changes).
  - apiGroups: [""]
    resources: [services]
    verbs: [create, patch]
  # Application: the StatefulSet -- created by create_fn, patched in place by update_fn
  # (spec.image/version changes).
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [create, patch]
  # Application: firebird.py execs isql/gsec into the instance's pod for provisioning and
  # password rotation; wait_for_pod_ready/wait_for_sysdba_ready read the pod's status first.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get]
  # Two verbs are both genuinely required here: the API server's own front-door authorization
  # for this GET-based websocket exec request needs `get`, but the request is then proxied to the
  # kubelet on the pod's node, which performs its own separate authorization check for pod
  # exec/attach/portforward that is always hardcoded to verb `create` regardless of the HTTP
  # method the front-door request used.
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubebird-operator
  namespace: kubebird-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubebird-operator
subjects:
  - kind: ServiceAccount
    name: kubebird-operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubebird-operator
  namespace: kubebird-system
spec:
  # kopf strongly recommends exactly one replica: two or more operators reconciling the same
  # objects collide unpredictably. `Recreate` avoids a brief two-pod overlap during rollouts.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kubebird-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubebird-operator
    spec:
      serviceAccountName: kubebird-operator
      containers:
        - name: kubebird-operator
          # Built via `docker build --build-arg VERSION=<version> -t kubebird:<version> .`
          # (see README.md) and pushed to a registry this cluster can pull from.
          image: quay.io/kubebird/operator:latest
          env:
            # Scopes kopf.run(namespaces=[...]) to this Deployment's own namespace
            # (kubebird-system), matching the namespaced Role/RoleBinding above -- see
            # src/kubebird/operator.py. Instance CRs must live in kubebird-system too.
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Sets the root logger's level (DEBUG/INFO/WARNING/ERROR/CRITICAL) --
            # see src/kubebird/operator.py's use of kopf.configure(). A fixed value
            # here; edit it directly to change verbosity for this deployment.
            - name: LOG_LEVEL
              value: INFO
