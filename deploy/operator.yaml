# Namespaced deployment of the Kubebird operator: the ServiceAccount/Role/RoleBinding below scope
# its own workload (Instances, Secrets, PVCs, Services, StatefulSets, pod exec) to a single
# namespace. None of the namespaced objects below hardcode one -- apply with
# `kubectl apply -n <namespace> -f deploy/operator.yaml` (or against a context whose current
# namespace is already set) to pick it. The one exception is the ClusterRoleBinding's `subjects[]`
# entry: a cluster-scoped object has no "current namespace" to infer from, so Kubernetes requires
# that namespace spelled out explicitly there -- keep it in sync with whatever namespace you apply
# the rest of this file into.
#
# A thin ClusterRole/ClusterRoleBinding is still required even for a namespaced operator: kopf's
# own framework needs read access to two genuinely cluster-scoped resource types
# (CustomResourceDefinitions, Namespaces) that have no namespaced equivalent to grant instead.
# See: https://kopf.dev/en/stable/deployment/ and https://kopf.dev/en/stable/rbac/
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubebird-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubebird-operator-cluster
rules:
  # Framework: kopf's runtime observation of CRDs & namespaces (both cluster-scoped resource
  # types, so this cannot be expressed as a namespaced Role no matter how narrow the operator's
  # own workload is).
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [list, watch]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubebird-operator-cluster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubebird-operator-cluster
subjects:
  # Must stay hardcoded (see the top-of-file note): ClusterRoleBinding subjects can't inherit an
  # "apply-time" namespace the way plain namespaced objects do.
  - kind: ServiceAccount
    name: kubebird-operator
    namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubebird-operator
rules:
  # Framework: cross-operator awareness (harmless no-op unless a KopfPeering CRD is separately
  # installed and peering is explicitly requested -- kubebird runs a single replica, so peering
  # itself is not required, only tolerated per kopf's own recommended RBAC).
  - apiGroups: [kopf.dev]
    resources: [kopfpeerings]
    verbs: [list, watch, patch, get]
  # Framework: posting events about handler progress/errors.
  - apiGroups: [""]
    resources: [events]
    verbs: [create]

  # Application: the Instance custom resource this operator watches and reconciles.
  - apiGroups: [kubebird.github.io]
    resources: [instances, instances/status]
    verbs: [get, list, watch, patch]
  # Application: the SYSDBA secret (auto-generated, or read+labeled if user-provided via
  # authentication.sysdba.secretRef) -- create.py/k8s.py/update.py get/create/patch it,
  # update.py's sysdba_secret_update_fn additionally lists/watches Secrets cluster-wide-in-namespace
  # to notice rotations.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch, create, patch]
  # Application: the primary/shadow PersistentVolumeClaims -- created once, never patched/deleted
  # (deletion happens via Kubernetes garbage-collecting kopf.adopt()-ed owner references).
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [create]
  # Application: the Service -- created by create_fn, patched in place by update_fn
  # (spec.service.type changes).
  - apiGroups: [""]
    resources: [services]
    verbs: [create, patch]
  # Application: the StatefulSet -- created by create_fn, patched in place by update_fn
  # (spec.image/version changes).
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [create, patch]
  # Application: firebird.py execs isql/gsec into the instance's pod for provisioning and
  # password rotation; wait_for_pod_ready/wait_for_sysdba_ready read the pod's status first.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubebird-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubebird-operator
subjects:
  - kind: ServiceAccount
    name: kubebird-operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubebird-operator
spec:
  # kopf strongly recommends exactly one replica: two or more operators reconciling the same
  # objects collide unpredictably. `Recreate` avoids a brief two-pod overlap during rollouts.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kubebird-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubebird-operator
    spec:
      serviceAccountName: kubebird-operator
      containers:
        - name: kubebird-operator
          # Built via `docker build --build-arg VERSION=<version> -t kubebird:<version> .`
          # (see README.md) and pushed to a registry this cluster can pull from.
          image: quay.io/kubebird/operator:latest
          env:
            # Scopes kopf.run(namespaces=[...]) to this Deployment's own namespace, matching the
            # namespaced Role/RoleBinding above -- see src/kubebird/operator.py.
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
