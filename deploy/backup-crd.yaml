apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: backups.kubebird.github.io
spec:
  group: kubebird.github.io
  scope: Namespaced
  names:
    kind: Backup
    listKind: BackupList
    plural: backups
    singular: backup
    shortNames:
      - fbbkp
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Instance
          type: string
          jsonPath: .spec.instanceRef
        - name: Type
          type: string
          jsonPath: .spec.type
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Error
          type: string
          jsonPath: .status.error
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - instanceRef
              properties:
                instanceRef:
                  type: string
                  description: >-
                    Name of the Instance to back up, in the same namespace as this Backup.
                type:
                  type: string
                  default: local
                  enum: [local, s3]
                  description: >-
                    "local" writes the backup only onto the Instance's storage.backup PVC;
                    "s3" additionally uploads it to the S3-compatible endpoint in "s3" below.
                include:
                  type: array
                  items:
                    type: string
                  description: >-
                    Database names (matching one of the Instance's spec.databases[].name
                    entries) to back up. If empty/omitted, every database on the Instance is
                    backed up.
                exclude:
                  type: array
                  items:
                    type: string
                  description: >-
                    Database names to skip, applied after "include". If empty/omitted, nothing
                    is excluded.
                s3:
                  type: object
                  description: Required if "type" is "s3"; ignored otherwise.
                  required:
                    - location
                    - credentials
                    - bucket
                  properties:
                    location:
                      type: string
                      description: >-
                        S3-compatible endpoint URL, e.g. "https://s3.remote-storage.com".
                    credentials:
                      type: object
                      required:
                        - ref
                      properties:
                        ref:
                          type: string
                          description: >-
                            Name of a Secret in the same namespace, holding "accessKey" and
                            "secretKey" keys.
                    bucket:
                      type: string
                      description: S3 bucket name.
                    path:
                      type: string
                      default: "/"
                      description: Key prefix within the bucket to store backups under.
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: Current lifecycle phase of the Backup as observed by the operator.
                message:
                  type: string
                  description: Human-readable detail about the current phase.
                error:
                  type: string
                  description: >-
                    Detail of the most recent handler failure, if any. Empty once a
                    reconciliation completes successfully. The operator keeps retrying on its
                    own; this field is for visibility, not a terminal failure indicator.
                timestamp:
                  type: string
                  description: >-
                    UTC timestamp (YYYYMMDDTHHMMSSZ) generated on the first reconcile attempt
                    and combined with the Backup's own name to build its backup directory.
                    Fixed once set, so a retry reuses the same directory instead of leaving an
                    orphaned partial backup behind on every attempt.
                path:
                  type: string
                  description: >-
                    Full path, inside the Instance's pod, under which this backup's files were
                    written (on the Instance's storage.backup PVC).
                files:
                  type: array
                  items:
                    type: string
                  description: File names (relative to "path") written for this backup.
