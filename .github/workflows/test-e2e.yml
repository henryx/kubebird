name: E2E Tests

on:
  push:
  pull_request:
  workflow_call:

permissions: {}

jobs:
  test-e2e:
    permissions:
      contents: read
    name: Run on Ubuntu (Firebird ${{ matrix.firebird-version }})
    runs-on: ubuntu-latest
    strategy:
      # Run every version to completion, so one version's failure doesn't
      # hide whether the others pass.
      fail-fast: false
      matrix:
        # The version most e2e specs deploy (FIREBIRD_VERSION, see
        # test/e2e/instance_helpers_test.go). Specs pinning their own
        # versions (version upgrades, incremental backups) run on every leg.
        firebird-version: ["3.0.14", "4.0.3", "5.0.4"]
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind "https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Running Test e2e
        env:
          FIREBIRD_VERSION: ${{ matrix.firebird-version }}
        run: |
          go mod tidy
          make test-e2e
