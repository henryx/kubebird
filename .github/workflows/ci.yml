name: CI

# Every push runs the full tox suite (lint/format/type/tests/coverage). If it
# passes, the image is pushed to quay.io/kubebird/operator:
#   - a plain branch push publishes the ":latest" tag;
#   - a tag push (e.g. "v1.2.3") publishes an image tagged with that same name.
# Credentials come from repository secrets QUAY_USERNAME/QUAY_PASSWORD (a
# quay.io robot account works well for PASSWORD).
on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install tox
        run: pip install tox

      # tox itself starts a real k3s container (via testcontainers) to run
      # tests/test_create.py/test_update.py/test_delete.py/test_k3s.py end to
      # end -- Docker is already available on GitHub-hosted Linux runners, no
      # extra setup needed.
      - name: Run tox (lint, format, type, tests, coverage report)
        run: tox

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine image tag
        id: meta
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.tag }}
          tags: quay.io/kubebird/operator:${{ steps.meta.outputs.tag }}
