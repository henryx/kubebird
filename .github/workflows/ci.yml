name: CI

# - A branch push, a pull request being opened/updated/reopened, or an
#   "approved" PR review runs the full tox suite (lint/format/type/tests/
#   coverage) -- no image is built, and a tag push does NOT run this job.
# - A tag push (e.g. "v1.2.3") runs only the release job: it builds and pushes
#   quay.io/kubebird/operator tagged both ":latest" and with the tag name
#   itself, with no test gate of its own -- by the time a commit is tagged, it
#   should already have gone through the test job via the push/PR that landed
#   it on main.
# Credentials for the release job come from repository secrets
# QUAY_USERNAME/QUAY_PASSWORD (a quay.io robot account works well for
# PASSWORD).
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted]

jobs:
  test:
    if: >
      (github.event_name == 'push' && github.ref_type != 'tag') ||
      github.event_name == 'pull_request' ||
      github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install tox
        run: pip install tox

      # tox itself starts a real k3s container (via testcontainers) to run
      # tests/test_create.py/test_update.py/test_delete.py/test_k3s.py end to
      # end -- Docker is already available on GitHub-hosted Linux runners, no
      # extra setup needed.
      - name: Run tox (lint, format, type, tests, coverage report)
        run: tox

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine image tags
        id: meta
        run: |
          image=quay.io/kubebird/operator
          version="${{ github.ref_name }}"
          tags="$image:latest"$'\n'"$image:$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<TAGS_EOF"
            echo "$tags"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
